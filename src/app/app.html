<main class="landing">
  <div class="ambient-glow" aria-hidden="true"></div>

  <section class="card" aria-labelledby="landing-heading">
    <div class="card-header">
      <p class="brand">{{ title() }}</p>
      <span class="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Coming Soon</span>
      </span>
    </div>

    <h1 id="landing-heading" class="headline">We are under construction</h1>

    <p class="description">Please go to our eBay page to see our products</p>

    <section class="shop-section" aria-labelledby="shop-now-heading">
      <h2 id="shop-now-heading" class="shop-heading">SHOP NOW</h2>
      <p class="shop-text">
        While our full web storefront is in development, browse and order our current range directly
        through our official eBay Business store:
        <a
          class="inline-link"
          [href]="ebayUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
        </a>
      </p>
    </section>

    <div class="actions">
      <a
        class="cta-link"
        [href]="ebayUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Visit our eBay Store</span>
        <span class="sr-only"> (opens in a new tab)</span>
        <svg
          class="cta-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M7 17 17 7" />
          <path d="M7 7h10v10" />
        </svg>
      </a>
    </div>

  </section>
</main>

<router-outlet />
<app-footer />
